<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agendar Cita - Andy The Barbers</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 30px;
      width: 350px;
      text-align: center;
    }
    h1 {
      color: #222;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      color: #333;
    }
    select, input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      margin-top: 20px;
      background-color: #000;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #444;
    }
    .resultado {
      margin-top: 20px;
      background: #e8e8e8;
      padding: 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Agendar Cita</h1>

    <label for="local">Selecciona el local:</label>
    <select id="local" onchange="actualizarBarbero()">
      <option value="">-- Selecciona --</option>
      <option value="1">Local 1 - Municipio</option>
      <option value="2">Local 2 - Pichincha Alta</option>
    </select>

    <label for="barbero">Barbero:</label>
    <input type="text" id="barbero" readonly placeholder="Selecciona un local primero">

    <label for="fecha">Fecha:</label>
    <input type="date" id="fecha">

    <label for="hora">Hora:</label>
    <input type="time" id="hora">

    <button onclick="agendarCita()">Confirmar Cita</button>

    <div class="resultado" id="resultado"></div>
  </div>

  <script>
    function actualizarBarbero() {
      const local = document.getElementById('local').value;
      const barberoInput = document.getElementById('barbero');
      if (local === '1') {
        barberoInput.value = 'Andy';
      } else if (local === '2') {
        barberoInput.value = 'Josue';
      } else {
        barberoInput.value = '';
      }
    }

    function agendarCita() {
      const local = document.getElementById('local').value;
      const barbero = document.getElementById('barbero').value;
      const fecha = document.getElementById('fecha').value;
      const hora = document.getElementById('hora').value;
      const añoActual = new Date().getFullYear();

      if (!local || !barbero || !fecha || !hora) {
        document.getElementById('resultado').innerHTML = '⚠️ Por favor completa todos los campos.';
        return;
      }

      const nombreLocal = local === '1' ? 'Municipio' : 'Pichincha Alta';
      document.getElementById('resultado').innerHTML = 
        `✅ Cita confirmada:<br>
         📍 Local: ${nombreLocal}<br>
         💈 Barbero: ${barbero}<br>
         📅 Fecha: ${fecha} (${añoActual})<br>
         ⏰ Hora: ${hora}`;
    }
  </script>
</body>
</html>
