<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agendar Cita - Andy The Barbers</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-image: url('fondo-barberia.jpg'); /* Cambia por tu imagen de fondo */
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      padding: 30px;
      width: 380px;
      text-align: center;
    }

    h1 {
      color: #222;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      color: #333;
      text-align: left;
    }

    select, input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .barbero-info {
      display: flex;
      align-items: center;
      margin-top: 10px;
      background: #f8f8f8;
      border-radius: 8px;
      padding: 8px;
    }

    .barbero-info img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      margin-right: 10px;
      object-fit: cover;
    }

    button {
      margin-top: 20px;
      background-color: #000;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #444;
    }

    .resultado {
      margin-top: 20px;
      background: #e8e8e8;
      padding: 10px;
      border-radius: 6px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Agendar Cita</h1>

    <label for="local">Selecciona el local:</label>
    <select id="local" onchange="actualizarBarbero()">
      <option value="">-- Selecciona --</option>
      <option value="1">Local 1 - Municipio</option>
      <option value="2">Local 2 - Pichincha Alta</option>
    </select>

    <label>Barbero:</label>
    <div class="barbero-info" id="barbero-info">
      <img id="foto-barbero" src="" alt="Foto del barbero">
      <span id="nombre-barbero">Selecciona un local</span>
    </div>

    <label for="fecha">Fecha:</label>
    <input type="date" id="fecha">

    <label for="hora">Hora:</label>
    <input type="time" id="hora">

    <button onclick="agendarCita()">Confirmar Cita</button>

    <div class="resultado" id="resultado"></div>
  </div>

  <script>
    function actualizarBarbero() {
      const local = document.getElementById('local').value;
      const foto = document.getElementById('foto-barbero');
      const nombre = document.getElementById('nombre-barbero');

      if (local === '1') {
        foto.src = 'andy.jpg'; // Cambia por la foto real de Andy
        nombre.textContent = 'Andy';
      } else if (local === '2') {
        foto.src = 'josue.jpg'; // Cambia por la foto real de Josue
        nombre.textContent = 'Josue';
      } else {
        foto.src = '';
        nombre.textContent = 'Selecciona un local';
      }
    }

    function agendarCita() {
      const local = document.getElementById('local').value;
      const barbero = document.getElementById('nombre-barbero').textContent;
      const fecha = document.getElementById('fecha').value;
      const hora = document.getElementById('hora').value;
      const añoActual = new Date().getFullYear();

      if (!local || !barbero || !fecha || !hora) {
        document.getElementById('resultado').innerHTML = '⚠️ Por favor completa todos los campos.';
        return;
      }

      const nombreLocal = local === '1' ? 'Municipio' : 'Pichincha Alta';
      document.getElementById('resultado').innerHTML = `
        ✅ Cita confirmada:<br>
        📍 Local: ${nombreLocal}<br>
        💈 Barbero: ${barbero}<br>
        📅 Fecha: ${fecha} (${añoActual})<br>
        ⏰ Hora: ${hora}
      `;
    }
  </script>
</body>
</html>
