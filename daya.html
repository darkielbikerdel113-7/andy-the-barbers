<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agendar Cita - Andy The Barbers</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: url('fondo-barberia.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      padding: 25px;
      width: 420px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #222;
    }

    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      margin-top: 15px;
      width: 48%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-agendar {
      background: #000;
      color: #fff;
    }

    .btn-eliminar {
      background: #c0392b;
      color: #fff;
    }

    .resultado {
      margin-top: 20px;
      background: #f0f0f0;
      padding: 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Agendar Cita</h1>

    <label for="local">Selecciona el local:</label>
    <select id="local">
      <option value="">-- Selecciona --</option>
      <option value="1">Local 1 - Municipio (Andy)</option>
      <option value="2">Local 2 - Pichincha Alta (Josue)</option>
    </select>

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" placeholder="Ej: Juan">

    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido" placeholder="Ej: Pérez">

    <label for="celular">Número de celular:</label>
    <input type="tel" id="celular" placeholder="Ej: 0999999999">

    <label for="dia">Día:</label>
    <input type="text" id="dia" placeholder="Ej: Lunes">

    <label for="fecha">Fecha:</label>
    <input type="date" id="fecha">

    <label for="hora">Hora:</label>
    <input type="time" id="hora">

    <div style="display:flex; justify-content:space-between;">
      <button class="btn-agendar" onclick="agendar()">Agendar</button>
      <button class="btn-eliminar" onclick="eliminar()">Eliminar</button>
    </div>

    <div class="resultado" id="resultado"></div>
  </div>

  <script>
    function agendar() {
      const local = document.getElementById('local').value;
      const nombre = document.getElementById('nombre').value;
      const apellido = document.getElementById('apellido').value;
      const celular = document.getElementById('celular').value;
      const dia = document.getElementById('dia').value;
      const fecha = document.getElementById('fecha').value;
      const hora = document.getElementById('hora').value;

      if (!local || !nombre || !apellido || !celular || !dia || !fecha || !hora) {
        document.getElementById('resultado').innerHTML = '⚠️ Completa todos los campos.';
        return;
      }

      const barbero = local === '1' ? 'Andy' : 'Josue';
      const nombreLocal = local === '1' ? 'Municipio' : 'Pichincha Alta';

      document.getElementById('resultado').innerHTML = `
        ✅ Reserva confirmada:<br>
        📍 Local: ${nombreLocal}<br>
        💈 Barbero: ${barbero}<br>
        👤 Cliente: ${nombre} ${apellido}<br>
        📱 Celular: ${celular}<br>
        📅 Día: ${dia} - Fecha: ${fecha}<br>
        ⏰ Hora: ${hora}
      `;
    }

    function eliminar() {
      document.getElementById('resultado').innerHTML = '❌ Reserva eliminada.';
    }
  </script>
</body>
</html>
